<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">F.R.E.T signal path</title>
  <desc id="d">An electric guitar connects by cable to the F.R.E.T pedal, which connects by cable to a guitar amplifier. The guitar's raw signal enters the pedal and a processed mono signal leaves it.</desc>

  <rect width="900" height="360" fill="#1c1b19"/>

  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#a89f8c" text-anchor="middle">
    <text x="165" y="44">electric guitar</text>
    <text x="460" y="44">F.R.E.T pedal</text>
    <text x="785" y="44">guitar amplifier</text>
  </g>

  <!-- ===== GUITAR ===== -->
  <!-- headstock + neck -->
  <rect x="24" y="139" width="42" height="24" rx="3" fill="#3c382f" stroke="#a89f8c" stroke-width="1.5"/>
  <g fill="#a89f8c">
    <circle cx="32" cy="143" r="2"/><circle cx="44" cy="143" r="2"/><circle cx="56" cy="143" r="2"/>
    <circle cx="32" cy="159" r="2"/><circle cx="44" cy="159" r="2"/><circle cx="56" cy="159" r="2"/>
  </g>
  <rect x="66" y="145" width="110" height="12" fill="#3c382f" stroke="#a89f8c" stroke-width="1.5"/>
  <g stroke="#a89f8c" stroke-opacity="0.5" stroke-width="1">
    <line x1="88" y1="145" x2="88" y2="157"/><line x1="108" y1="145" x2="108" y2="157"/>
    <line x1="126" y1="145" x2="126" y2="157"/><line x1="143" y1="145" x2="143" y2="157"/>
    <line x1="159" y1="145" x2="159" y2="157"/>
  </g>
  <!-- body: outline pass, then fill pass to hide inner overlap -->
  <g fill="#2b2822" stroke="#a89f8c" stroke-width="3">
    <ellipse cx="200" cy="151" rx="40" ry="46"/>
    <ellipse cx="240" cy="151" rx="52" ry="62"/>
  </g>
  <g fill="#2b2822">
    <ellipse cx="200" cy="151" rx="40" ry="46"/>
    <ellipse cx="240" cy="151" rx="52" ry="62"/>
  </g>
  <!-- pickups, bridge, knobs, strings -->
  <rect x="198" y="128" width="8" height="46" rx="2" fill="#1c1b19" stroke="#a89f8c" stroke-width="1"/>
  <rect x="226" y="124" width="8" height="54" rx="2" fill="#1c1b19" stroke="#a89f8c" stroke-width="1"/>
  <rect x="268" y="130" width="7" height="42" rx="2" fill="#a89f8c"/>
  <g stroke="#a89f8c" stroke-opacity="0.7" stroke-width="0.9">
    <line x1="66" y1="147" x2="270" y2="147"/><line x1="66" y1="151" x2="270" y2="151"/><line x1="66" y1="155" x2="270" y2="155"/>
  </g>
  <circle cx="254" cy="190" r="5" fill="#1c1b19" stroke="#a89f8c" stroke-width="1.2"/>
  <circle cx="232" cy="196" r="5" fill="#1c1b19" stroke="#a89f8c" stroke-width="1.2"/>
  <!-- output jack -->
  <circle cx="240" cy="213" r="4.5" fill="#d98f2b"/>

  <!-- ===== CABLES ===== -->
  <g fill="none" stroke="#d98f2b" stroke-width="3" stroke-linecap="round">
    <path d="M240 217 C240 290 300 184 362 184"/>
    <path d="M558 184 C595 222 645 222 682 184"/>
  </g>
  <rect x="360" y="179" width="20" height="10" rx="2" fill="#a89f8c"/>
  <rect x="540" y="179" width="20" height="10" rx="2" fill="#a89f8c"/>
  <rect x="680" y="179" width="20" height="10" rx="2" fill="#a89f8c"/>

  <!-- ===== F.R.E.T PEDAL ===== -->
  <rect x="380" y="64" width="160" height="212" rx="8" fill="#242220" stroke="#d98f2b" stroke-width="2"/>
  <g fill="#3c382f">
    <circle cx="392" cy="76" r="3"/><circle cx="528" cy="76" r="3"/>
    <circle cx="392" cy="264" r="3"/><circle cx="528" cy="264" r="3"/>
  </g>
  <text x="460" y="96" text-anchor="middle" font-family="'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif" font-weight="700" font-size="26" letter-spacing="1.5" fill="#ede6d6">F.R.E.T</text>
  <!-- knobs -->
  <g stroke="#a89f8c" stroke-width="1.5" fill="#1c1b19">
    <circle cx="422" cy="128" r="13"/><circle cx="460" cy="128" r="13"/><circle cx="498" cy="128" r="13"/>
  </g>
  <g stroke="#d98f2b" stroke-width="2" stroke-linecap="round">
    <line x1="422" y1="128" x2="422" y2="118" transform="rotate(-50 422 128)"/>
    <line x1="460" y1="128" x2="460" y2="118" transform="rotate(20 460 128)"/>
    <line x1="498" y1="128" x2="498" y2="118" transform="rotate(70 498 128)"/>
  </g>
  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#a89f8c" text-anchor="middle">
    <text x="422" y="154">level</text><text x="460" y="154">tone</text><text x="498" y="154">mix</text>
  </g>
  <!-- display + jack labels -->
  <rect x="404" y="164" width="112" height="40" rx="3" fill="#1c1b19" stroke="#3c382f" stroke-width="1.5"/>
  <path d="M410 184 Q422.5 164 435 184 T460 184 T485 184 T510 184" fill="none" stroke="#4f9d92" stroke-width="2"/>
  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#a89f8c">
    <text x="386" y="170">in</text>
    <text x="534" y="170" text-anchor="end">out</text>
  </g>
  <!-- LED + footswitch -->
  <circle cx="460" cy="222" r="9" fill="#d98f2b" fill-opacity="0.22"/>
  <circle cx="460" cy="222" r="4" fill="#d98f2b"/>
  <circle cx="460" cy="248" r="16" fill="#1c1b19" stroke="#a89f8c" stroke-width="2"/>
  <circle cx="460" cy="248" r="10" fill="#3c382f"/>

  <!-- ===== AMPLIFIER ===== -->
  <path d="M755 100 V90 Q755 84 761 84 H809 Q815 84 815 90 V100" fill="none" stroke="#a89f8c" stroke-width="2"/>
  <rect x="700" y="100" width="170" height="176" rx="6" fill="#242220" stroke="#a89f8c" stroke-width="2"/>
  <rect x="700" y="100" width="170" height="40" fill="#2b2822" stroke="#3c382f" stroke-width="1.5"/>
  <g fill="#1c1b19" stroke="#a89f8c" stroke-width="1.2">
    <circle cx="724" cy="120" r="7"/><circle cx="750" cy="120" r="7"/><circle cx="776" cy="120" r="7"/>
    <circle cx="802" cy="120" r="7"/><circle cx="828" cy="120" r="7"/>
  </g>
  <circle cx="852" cy="120" r="3" fill="#d98f2b"/>
  <rect x="712" y="152" width="146" height="112" rx="4" fill="#1c1b19" stroke="#3c382f" stroke-width="1.5"/>
  <g fill="none" stroke="#3c382f" stroke-width="2">
    <circle cx="785" cy="208" r="44"/><circle cx="785" cy="208" r="30"/>
  </g>
  <circle cx="785" cy="208" r="12" fill="#3c382f"/>
  <circle cx="700" cy="184" r="4.5" fill="#d98f2b"/>

  <!-- ===== SIGNAL READOUTS ===== -->
  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#a89f8c">
    <g transform="translate(262 300)">
      <text x="0" y="0">raw guitar signal</text>
      <path d="M0 24 Q13.75 8 27.5 24 T55 24 T82.5 24 T110 24" fill="none" stroke="#d98f2b" stroke-width="2"/>
    </g>
    <g transform="translate(560 300)">
      <text x="0" y="0">processed mono out</text>
      <polyline points="0,24 8,10 22,10 30,24 38,38 52,38 60,24 68,10 82,10 90,24 98,38 110,38" fill="none" stroke="#4f9d92" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
