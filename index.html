<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.E.T Landing Page</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .download-button {
            display: inline-block;
            padding: 14px 28px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .download-button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>F.R.E.T Landing Page</h1>
        <p>Click below to access the Divide and Conquer document, which serves as a project proposal.</p>

        <!-- Replace "document.docx" with the actual filename -->
        <a
            class="download-button"
            href="Divide and Conquer.pdf"
            download
        >
            Download Document
        </a>
    </main>
</body>
</html>
